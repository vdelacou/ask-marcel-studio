# Once a week, bun audit checks the locked dependency tree against the advisory database, so
# an advisory published against a package nobody touched still turns up. It reads bun.lock
# alone, with no install. High and critical fail the run; moderate and low are printed only.
# Actions are pinned to commit SHAs, Bun to an exact version.
name: audit

on:
  schedule:
    - cron: '17 5 * * 1' # Mondays, 05:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: audit (fails on high and critical)
        run: bun audit --audit-level=high
