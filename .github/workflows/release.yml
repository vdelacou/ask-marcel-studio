# Builds the macOS DMGs, one per architecture, each on a runner of that architecture: the
# Python runtime and its wheels are fetched for the host, so a cross-build would ship the
# wrong ones. A pushed v* tag also attaches both DMGs to a DRAFT release, which the owner
# reviews and publishes by hand. Started by hand, it only builds and keeps the DMGs as run
# artifacts, which is how a packaging change is tried without a release. Actions are pinned
# to commit SHAs, tools to exact versions.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dmg:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x64
            triple: x86_64-apple-darwin
          - runner: macos-15
            arch: arm64
            triple: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      # electron-vite and electron-builder run under node.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(bun -e 'console.log((await Bun.file("package.json").json()).version)')
          test "v${version}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} but package.json says ${version}"; exit 1; }
      - name: install (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: python runtime and wheels for this architecture
        run: |
          bun run fetch:python --triple ${{ matrix.triple }}
          bun run fetch:wheels
      - name: build
        run: bun run build
      - name: package the DMG
        env:
          PYTHON_TRIPLE: ${{ matrix.triple }}
        run: bunx electron-builder --mac --${{ matrix.arch }} --publish never
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dmg-${{ matrix.arch }}
          path: release/*.dmg
          if-no-files-found: error
          retention-days: 14

  draft-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: dmg
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dmg-*
          path: dmg
          merge-multiple: true
      - name: draft the release with both DMGs
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dmg/*.dmg --repo "${GITHUB_REPOSITORY}" --draft --verify-tag --title "${GITHUB_REF_NAME}" --generate-notes
