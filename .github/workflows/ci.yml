# The gates the pre-commit hook runs, run again on every push: on a fresh install, as a user
# that is not root, with no hook to skip. A commit made without the hook, or past it, is still
# checked here. Commit size and mutation stay in the hook: the first judges a single commit,
# the second takes minutes a file. A pull request from a branch of this repo shows the run of
# its head commit. Actions are pinned to commit SHAs, tools to exact versions.
name: ci

on: [push, workflow_dispatch]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A newer push to a branch makes the older run moot; every run on main finishes.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks reads every commit
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      # eslint and tsc run under node (their shebangs ask for it), and eslint-plugin-unicorn 72
      # needs node 22 or later.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: install (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: identity (rule 26)
        run: bash scripts/check-identity.sh
      - name: package.json (no latest / *)
        run: bash scripts/check-package-json.sh
      - name: secret scan (gitleaks, every commit)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -sSfL --max-time 120 -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --verbose .
      - name: tests
        run: bun test
      - name: strict lint (0 errors, 0 warnings)
        run: bun run lint:strict
      - name: typecheck
        run: bun run typecheck
      - name: coverage (per-tier)
        run: bun run coverage
